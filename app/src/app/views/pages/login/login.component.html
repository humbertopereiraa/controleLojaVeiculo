<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card [ngStyle]="{'minWidth.%': 44}" class="text-white bg-black py-5">
            <c-card-body class="text-center d-flex align-items-center justify-content-center">
              <div>
                <h2>ClubeCar</h2>
                <p>
                  Controle de Veículos
                </p>
                <!-- <button [active]="true" cButton class="mt-3" color="primary" routerLink="/register">
                  Register Now!
                </button>  -->
              </div>
            </c-card-body>
          </c-card>
          <c-card class="p-4">
            <c-card-body>
              <form cForm (submit)="login()">
                <h1>Login</h1>
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input autoComplete="email" cFormControl placeholder="Email" [(ngModel)]="email"
                    name="email" />
                </c-input-group>
                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input autoComplete="current-password" cFormControl placeholder="Senha" type="password"
                    [(ngModel)]="password" name="password" />
                </c-input-group>
                <c-row>
                  <c-col xs="6">
                    <button cButton class="px-0" color="link">
                      Esqueceu sua senha?
                    </button>
                  </c-col>
                  <c-col class="text-lg-end" xs="6">
                    <button cButton class="px-4" color="info" type="submit">
                      Entrar
                    </button>
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>

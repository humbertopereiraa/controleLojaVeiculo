<div class="container-fluid">
  <div class="row">
    <div class="col">
      <div class="timeline-steps aos-init aos-animate" data-aos="fade-up">
        <div class="timeline-step" *ngFor="let evento of timelines">
          <div class="timeline-content" data-toggle="popover" data-trigger="hover" data-placement="top">
            <div class="inner-circle"></div>
            <p class="mt-3 mb-1">{{ evento.data | date: 'dd/MM/yyyy hh:mm' }}</p>
            <p class="text-muted mb-0 mb-lg-0">{{ evento.descricao }}</p>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
